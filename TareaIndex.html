<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Pre-Matrícula Universitaria</title>
 <link rel="stylesheet" href="ttareastyle.css">
</head>
<body>
 <main class="container">
 <header class="form-header">
 <h1>Solicitud de Pre-Matrícula</h1>
 <p>Ingresa tus datos para iniciar tu proceso de admisión 
    académica.</p>
 </header>
 <form action="#" method="POST" class="university-form"
id="registrationForm">

 <fieldset class="form-section">
 <legend>1. Información Personal</legend>

 <div class="input-group">
 <label for="fullname">Nombre Completo *</label>
<input type="text" id="fullname" name="fullname"
placeholder="Ej. Ana María López" required>
 </div>
 <div class="grid-2">
 <div class="input-group">
 <label for="identity">Identificación *</label>
<input type="text" id="identity" name="identity"
pattern="[0-9]{13}" placeholder="13 dígitos sin guiones" required>
 </div>
 <div class="input-group">
 <label for="birthdate">Fecha de Nacimiento *</label>
<input type="date" id="birthdate" name="birthdate"
required>
 </div>
 </div>
 <div class="grid-2">
 <div class="input-group">
 <label for="email">Correo Electrónico *</label>
<input type="email" id="email" name="email"
placeholder="estudiante@correo.com" required>
 </div>
 <div class="input-group">
 <label for="phone">Teléfono *</label>
<input type="tel" id="phone" name="phone" 
placeholder="9999-9999" required>
 </div>
 </div>
 </fieldset>
 <fieldset class="form-section">
 <legend>2. Selección Académica</legend>
 <div class="input-group">
 <label for="career">Carrera a Aspirar *</label>
<select id="career" name="career" required>
 <option value="" disabled selected>Selecciona una
carrera...</option>
<option value="ing-sistemas">Ingeniería en Sistemas /
Computación</option>
 <option value="lic-informatica">Licenciatura en
Informática Administrativa</option>
 <option value="ing-industrial">Ingeniería
Industrial</option>
 <option value="diseño-digital">Diseño y Desarrollo
Digital</option>
 </select>
 </div>
 <div class="input-group">
 <label>Jornada de Estudio *</label>
<div class="radio-group">
 <label><input type="radio" name="shift" value="matutina"
required> Matutina</label>
 <label><input type="radio" name="shift"
value="vespertina"> Vespertina</label>
 <label><input type="radio" name="shift" value="nocturna">
Nocturna</label>
 </div>
 </div>
 <div class="input-group">
 <label for="documents">Adjuntar Título (PDF) *</label>
<input type="file" id="documents" name="documents"
accept=".pdf" required>
 </div>
 </fieldset>
 <fieldset class="form-section no-border">
 <div class="checkbox-group">
 <input type="checkbox" id="terms" name="terms" required>
<label for="terms">Declaro que la información proporcionada es
verídica.</label>
 </div>
 <button type="submit" class="btn-submit">Completar Pre-
    Matrícula</button>
 </fieldset>
 </form>
 </main>
</body>
</html>
